<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04040a">
<title>리듬 스텝</title>
<script src="/common/i18n-wait.js"></script>
<link rel="stylesheet" href="/vendor/pretendard/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/vendor/anton/index.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three-addons/" } }
</script>
</head>
<body>
<canvas id="stage"></canvas>
<canvas id="lanes" class="hidden"></canvas>
<div class="vig"></div>

<!-- 경기 중: 곡 띠, 참가 QR -->
<div id="songbar" class="songbar hidden">
  <img id="sbCover" alt="">
  <div class="sb-txt"><b id="sbTitle"></b><span id="sbSub"></span></div>
  <div class="sb-prog"><i id="sbProg"></i></div>
  <span class="sb-time" id="sbTime">0:00</span>
</div>
<div id="join" class="join hidden">
  <img id="qrMini" alt="">
  <div><span>참가</span><b id="codeMini">----</b></div>
</div>
<div id="count" class="count"></div>
<div id="banner" class="banner"><b></b><span></span></div>
<div id="soundChip" class="sound-chip hidden">화면을 한 번 눌러 소리 켜기</div>
<div id="hold" class="hold hidden"><b>🔊 소리를 켜 주세요</b><span>화면을 클릭하거나 아무 키나 누르세요</span></div>

<!-- 대기실 겸 노래 고르기 -->
<section id="select" class="screen">
  <div class="langbox" id="langBox"></div>
  <div class="sel">
    <div class="sel-left">
      <div class="eyebrow">1~4인 · 패드 / 모션</div>
      <h1 class="wordmark">RHYTHM<br><span>STEP</span></h1>
      <p class="lede">화살표에 맞춰 폰을 눌러요.</p>
      <div class="tutbox" id="tutBox"></div>
    </div>
    <div class="sel-mid">
      <div class="picker" id="picker"></div>
      <div class="picked hidden" id="picked"></div>
    </div>
    <div class="sel-right">
      <div class="qr-card">
        <img id="qr" alt="참가 QR">
        <div class="qr-code"><span>방 코드</span><b id="code">----</b></div>
        <div class="qr-url" id="url"></div>
        <div class="qr-warn hidden" id="warn">http 주소라서 모션은 꺼져요.</div>
      </div>
    </div>
  </div>
  <div class="roster" id="roster"></div>
  <div class="foot" id="foot"></div>
</section>

<!-- 결과 -->
<section id="over" class="screen hidden">
  <div class="over">
    <div class="eyebrow" id="ovEyebrow">RESULT</div>
    <h1 class="ov-title" id="ovTitle"></h1>
    <div class="ranks" id="ranks"></div>
    <div class="ov-hint" id="ovHint"></div>
  </div>
</section>

<section id="replaced" class="screen hidden">
  <div class="over"><h1 class="ov-title">다른 화면에서 열었어요</h1><p class="lede">이 방은 마지막으로 연 화면에서 이어져요.</p></div>
</section>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/common/ready.js"></script>
<script type="module" src="/rhythm/i18n.js"></script>
<script type="module" src="/common/i18n-common.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
