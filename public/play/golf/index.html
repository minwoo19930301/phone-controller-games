<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1a14">
<title>골프 컨트롤러</title>
<link rel="stylesheet" href="/vendor/pretendard/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/vendor/anton/index.css">
<style>
  :root { --c: #ff5a5f; --bg: #0b1a14; --fg: #f4f2ea; --dim: #9db3a6; --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 16px);
    background: radial-gradient(120% 60% at 50% 0%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%), var(--bg); }
  header { display: flex; align-items: center; justify-content: space-between; height: 44px; }
  .me { font-family: Anton, Impact, sans-serif; font-size: 26px; padding: 2px 14px; border-radius: 999px; background: var(--c); color: #0b0f17; }
  .room { color: var(--dim); font-size: 13px; letter-spacing: .1em; }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .view { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .view.on { display: flex; }
  .center { align-items: center; justify-content: center; text-align: center; gap: 14px; }
  h1 { margin: 0; font-size: 30px; line-height: 1.25; letter-spacing: -.02em; }
  p { margin: 0; color: var(--dim); font-size: 16px; line-height: 1.55; white-space: pre-line; }
  button { font: inherit; border: 0; cursor: pointer; }
  .primary { width: 100%; padding: 19px; border-radius: 18px; background: var(--c); color: #0b0f17; font-size: 21px; font-weight: 800; }
  .ghost { width: 100%; padding: 14px; border-radius: 16px; background: transparent; color: var(--fg); border: 1.5px solid var(--line); font-size: 16px; font-weight: 700; }
  .grip { width: 150px; height: 180px; }

  /* 조준 */
  .aim-top { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 10px; }
  .aim-top b { font-size: 22px; }
  .aim-top span { color: var(--dim); font-size: 14px; }
  .pad { position: relative; flex: 1; min-height: 180px; border-radius: 22px; overflow: hidden; border: 1px solid var(--line);
    background: linear-gradient(180deg, #16402b 0%, #1f5a39 60%, #2a6e45 100%); }
  .pad svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pad .lab { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 14px; color: rgba(255,255,255,.75); }
  .pad .deg { position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-family: Anton, Impact, sans-serif; font-size: 30px; }
  .clubs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
  .clubs button { padding: 12px 0 10px; border-radius: 14px; background: rgba(255,255,255,.06); color: var(--fg); border: 1.5px solid var(--line); }
  .clubs button b { display: block; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 22px; }
  .clubs button span { font-size: 11px; color: var(--dim); }
  .clubs button.on { background: var(--c); color: #0b0f17; border-color: var(--c); }
  .clubs button.on span { color: rgba(0,0,0,.6); }

  /* 스윙 */
  .meter { width: 240px; height: 240px; }
  .count { font-family: Anton, Impact, sans-serif; font-size: 80px; line-height: 1; }
  .big { font-size: 40px; font-weight: 900; letter-spacing: -.03em; }
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .chip { padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.07); font-size: 14px; color: var(--dim); }
  .chip b { color: var(--fg); font-size: 18px; margin-left: 4px; }
  .flash { animation: flash .5s; }
  @keyframes flash { from { background: var(--c); } }
  .debug { position: fixed; left: 8px; bottom: calc(env(safe-area-inset-bottom) + 4px); font: 11px ui-monospace, monospace; color: rgba(255,255,255,.35); }
</style>
</head>
<body>
<header><span class="me" id="me">…</span><span class="room" id="room"></span></header>
<main>
  <!-- 처음 -->
  <section class="view center on" id="vStart">
    <svg class="grip" viewBox="0 0 150 180" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="55" y="8" width="40" height="78" rx="9" stroke="#fff" stroke-width="3"/>
      <path d="M62 30h26" stroke="var(--c)" stroke-width="3"/>
      <path d="M40 96c10-14 60-14 70 0l-6 30c-8 10-50 10-58 0z" fill="#e2ae86" stroke="none"/>
      <path d="M75 126v50" stroke="#c7c7c7" stroke-width="5"/>
      <path d="M66 172h22" stroke="#9aa" stroke-width="7"/>
    </svg>
    <h1>폰이 골프채가 됩니다</h1>
    <p>폰 아래쪽을 두 손으로 그립처럼 쥐고
화면이 목표 쪽을 보게 하세요.</p>
    <button class="primary" id="btnStart" style="margin-top:10px">시작하기</button>
  </section>

  <!-- 메시지 -->
  <section class="view center" id="vMsg"><h1 id="msgT"></h1><p id="msgB"></p></section>

  <!-- 다른 사람 차례 -->
  <section class="view center" id="vWait">
    <div class="big" id="waitT">대기실</div>
    <p id="waitB"></p>
    <div class="chips" id="myStats"></div>
    <button class="primary" id="btnGo" style="margin-top:14px">게임 시작</button>
  </section>

  <!-- 내 차례: 조준 -->
  <section class="view" id="vAim">
    <div class="aim-top"><b>방향 맞추기</b><span id="aimInfo">핀까지 145m</span></div>
    <div class="pad" id="pad">
      <svg viewBox="0 0 300 260" preserveAspectRatio="none" id="padSvg">
        <path d="M150 250 L150 20" stroke="rgba(255,255,255,.25)" stroke-width="2" stroke-dasharray="6 8"/>
        <circle cx="150" cy="40" r="16" fill="#cfe9b8" opacity=".9"/>
        <path d="M150 40v-30" stroke="#fff" stroke-width="2"/><path d="M150 12l14 6-14 6z" fill="var(--c)"/>
        <path id="aimLine" d="M150 250 L150 40" stroke="var(--c)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="150" cy="250" r="6" fill="#fff"/>
      </svg>
      <div class="deg" id="aimDeg">0°</div>
      <div class="lab">좌우로 밀어서 방향을 맞춰요</div>
    </div>
    <div class="clubs" id="clubs"></div>
    <button class="primary" id="btnAddress">어드레스</button>
  </section>

  <!-- 어드레스 잡는 중 -->
  <section class="view center" id="vHold">
    <div class="count" id="holdN">3</div>
    <h1>그립을 잡고 멈추세요</h1>
    <p>폰 윗부분이 공을, 화면이 목표를 보게.</p>
  </section>

  <!-- 스윙 -->
  <section class="view center" id="vSwing">
    <svg class="meter" viewBox="-120 -120 240 240">
      <circle r="100" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14"/>
      <path id="arc" fill="none" stroke="var(--c)" stroke-width="14" stroke-linecap="round"/>
      <line id="shaft" x1="0" y1="0" x2="0" y2="96" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <circle r="7" fill="#fff"/>
    </svg>
    <div class="big" id="swingT">스윙하세요</div>
    <p id="swingB">천천히 들어 올렸다가 끝까지 휘둘러요.</p>
  </section>

  <!-- 결과 -->
  <section class="view center" id="vResult">
    <div class="big" id="resT"></div>
    <div class="chips" id="resChips"></div>
    <p id="resB"></p>
  </section>
</main>
<div class="debug" id="debug"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="controller.js"></script>
</body>
</html>
