<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08130d">
<title>양궁 컨트롤러</title>
<script src="/common/i18n-wait.js"></script>
<link rel="stylesheet" href="/vendor/pretendard/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/vendor/anton/index.css">
<style>
  :root { --c: #ff5a5f; --bg: #08130d; --fg: #f3f6ef; --dim: #a5b6a8; --line: rgba(255,255,255,.14); --gold: #ffd84a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 14px);
    background: radial-gradient(120% 55% at 50% 0%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%), var(--bg); }
  header { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; height: 44px; flex: none; }
  .me { font-family: Anton, Impact, sans-serif; font-size: 26px; padding: 2px 14px; border-radius: 999px; background: var(--c); color: #0b0f17; }
  .room { flex: 1; color: var(--dim); font-size: 13px; letter-spacing: .1em; }
  .recal { padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.08); color: var(--fg); border: 1.5px solid var(--line); font-size: 13px; font-weight: 700; }
  .hidden { display: none !important; }
  .langbox { position: absolute; top: 0; right: 0; z-index: 3; }
  .banner { position: relative; z-index: 2; margin: 6px 0 0; padding: 9px 12px; border-radius: 12px; background: rgba(255,90,95,.14); color: #ffb3b5; font-size: 13px; text-align: center; flex: none; }
  main { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .view { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .view.on { display: flex; }
  .center { align-items: center; justify-content: center; text-align: center; gap: 14px; }
  h1 { margin: 0; font-size: 28px; line-height: 1.25; letter-spacing: -.02em; }
  p { margin: 0; color: var(--dim); font-size: 16px; line-height: 1.55; white-space: pre-line; }
  .note { font-size: 13px; color: #ffcf8a; }
  button { font: inherit; border: 0; cursor: pointer; color: inherit; }
  button:disabled { opacity: .55; }
  .primary { width: 100%; padding: 19px; border-radius: 18px; background: var(--c); color: #0b0f17; font-size: 21px; font-weight: 800; box-shadow: 0 0 30px color-mix(in srgb, var(--c) 35%, transparent); }
  .primary.waiting { background: rgba(255,255,255,.1); color: var(--fg); box-shadow: none; border: 1.5px solid var(--c); }
  .ghost { width: 100%; padding: 14px; border-radius: 16px; background: transparent; color: var(--fg); border: 1.5px solid var(--line); font-size: 16px; font-weight: 700; }
  .art { width: 130px; height: 150px; overflow: visible; }
  .big { font-size: 40px; font-weight: 900; letter-spacing: -.03em; }
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .chip { padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.07); font-size: 14px; color: var(--dim); }
  .chip b { color: var(--fg); font-size: 16px; margin-left: 4px; }
  .chip.ok b { color: #7ef0a0; }
  .aimart * { fill: none; stroke: var(--c); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

  /* 대기실 */
  .wait { gap: 10px; overflow-y: auto; justify-content: flex-start; padding-top: 6px; }
  .wait > * { flex: none; }
  .wait .big { margin-top: auto; }
  .wait #tutLink { margin-bottom: auto; }
  .setbox { width: 100%; }
  .readyrow { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; }
  .readyrow .rr-h { width: 100%; color: var(--dim); font-size: 12.5px; }
  .readyrow .rr { padding: 3px 10px; border-radius: 999px; color: var(--pc); box-shadow: inset 0 0 0 1.5px var(--pc); font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 14px; letter-spacing: .03em; }
  .readyrow .rr.on { background: var(--pc); color: #0b0f17; box-shadow: none; }
  .readyrow .rr.away { opacity: .45; }
  .readyrow .rr.mine { outline: 2px solid rgba(255,255,255,.75); outline-offset: 2px; }
  .primary.go { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 66px; }
  .primary.go small { font-size: 13px; font-weight: 700; color: var(--dim); }
  .primary.go.ready { background: color-mix(in srgb, #5ee07a 18%, rgba(255,255,255,.04)); border: 2px solid #5ee07a; color: #c9ffd8; opacity: 1; }
  .scorecard { width: 100%; display: grid; gap: 6px; }
  .scorecard .sr { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 12px; background: rgba(255,255,255,.06); border-left: 4px solid var(--pc); font-size: 14px; font-weight: 800; }
  .scorecard .sr b { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 20px; color: var(--pc); }
  .scorecard .sr span { flex: 1; text-align: right; color: var(--dim); font-size: 12.5px; }
  .scorecard .sr em { font-style: normal; font-family: Anton, Impact, sans-serif; font-size: 22px; color: var(--fg); margin-left: 6px; }

  /* 경기 중 */
  .hudrow { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; margin: 4px 0 2px; padding: 8px 14px; border-radius: 18px; background: rgba(0,0,0,.35); border: 1px solid var(--line); flex: none; }
  .sc { display: flex; flex-direction: column; line-height: 1; }
  .sc b { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 42px; }
  .sc span { color: var(--dim); font-size: 11.5px; font-weight: 800; margin-top: 3px; }
  .mid { text-align: center; }
  .mid b { display: block; font-size: 15px; font-weight: 900; }
  .mid span { font-size: 12.5px; color: var(--dim); font-weight: 700; }
  .arrowsleft { display: flex; gap: 4px; justify-content: center; margin-top: 4px; }
  .arrowsleft i { width: 22px; height: 5px; border-radius: 3px; background: var(--c); }
  .arrowsleft i.spent { opacity: .2; }
  .windchip { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 62px; }
  .windchip svg { width: 46px; height: 46px; overflow: visible; }
  .windchip .wc-bg { fill: rgba(255,255,255,.06); stroke: rgba(255,255,255,.3); stroke-width: 2; }
  .windchip .wc-ar { fill: none; stroke: #f4c542; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
  .windchip b { font-size: 15px; font-weight: 900; }
  .windchip span { font-size: 10.5px; color: var(--dim); font-weight: 700; }
  .status { min-height: 26px; text-align: center; font-size: 16px; font-weight: 800; color: var(--fg); margin: 4px 0; flex: none; }
  .status.turn { color: var(--c); font-size: 18px; animation: pulse 1.1s infinite alternate; }
  .status.warn { color: #ffd0a0; }
  @keyframes pulse { to { opacity: .6; } }
  .sightwrap { position: relative; flex: none; height: 24vh; min-height: 120px; max-height: 200px; display: flex; align-items: center; justify-content: center; margin: 2px 0; }
  .sight { position: relative; height: 100%; aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); touch-action: none;
    background: radial-gradient(circle, transparent 0 14%, rgba(255,255,255,.12) 14.5% 15.5%, transparent 16% 31%, rgba(255,255,255,.1) 31.5% 32.5%, transparent 33% 50%, rgba(255,255,255,.08) 50.5% 51.5%, transparent 52% 100%),
      radial-gradient(circle, color-mix(in srgb, var(--c) 14%, transparent), transparent 70%); }
  .sight::before, .sight::after { content: ""; position: absolute; background: rgba(255,255,255,.18); }
  .sight::before { left: 50%; top: 6%; bottom: 6%; width: 1px; }
  .sight::after { top: 50%; left: 6%; right: 6%; height: 1px; }
  .sight .dotp { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 16px var(--c), 0 0 0 3px rgba(0,0,0,.5); left: 50%; top: 50%; }
  .sight.drag { border-style: dashed; border-color: var(--c); }
  .sightlabel { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; font-size: 11.5px; font-weight: 800; color: var(--dim); }
  .bowzone { position: relative; flex: 1; min-height: 200px; margin-top: 6px; border-radius: 26px; background: linear-gradient(180deg, rgba(255,255,255,.04), color-mix(in srgb, var(--c) 10%, rgba(255,255,255,.03)));
    border: 1.5px solid var(--line); touch-action: none; overflow: hidden; }
  .bowzone.mine { border-color: var(--c); box-shadow: 0 0 30px color-mix(in srgb, var(--c) 30%, transparent), inset 0 0 40px color-mix(in srgb, var(--c) 10%, transparent); }
  .bowzone.off { opacity: .5; }
  .shootbtn { flex: none; margin-top: 8px; padding: 16px; font-size: 19px; }
  .shootbtn:disabled { background: rgba(255,255,255,.1); color: var(--dim); box-shadow: none; }
  .bowzone svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bowzone .limb { fill: none; stroke: #e5e9ee; stroke-width: 7; stroke-linecap: round; }
  .bowzone .limb2 { fill: none; stroke: var(--c); stroke-width: 3; stroke-linecap: round; opacity: .9; }
  .bowzone .riser { fill: #2a2f38; stroke: #e5e9ee; stroke-width: 2.5; }
  .bowzone .str { fill: none; stroke: #f3e6c3; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .bowzone .shaft { stroke: #cfd6df; stroke-width: 3; stroke-linecap: round; }
  .bowzone .vane { fill: var(--c); }
  .bowzone .fullmark { stroke: #5ee07a; stroke-width: 2; stroke-dasharray: 6 6; opacity: .7; }
  .bowzone .nockdot { fill: var(--gold); stroke: rgba(0,0,0,.5); stroke-width: 2; }
  .bowzone .pulltxt { fill: var(--fg); font: 900 15px "Pretendard Variable", sans-serif; text-anchor: middle; }
  .bowzone .hint { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 14px; font-weight: 800; color: var(--fg); text-shadow: 0 1px 6px #000; padding: 0 12px; }
  .bowzone.full .nockdot { fill: #5ee07a; }
  .bowzone.tired { animation: shake .09s infinite; }
  @keyframes shake { 0% { transform: translate(-1px, 0); } 50% { transform: translate(1px, 1px); } 100% { transform: translate(0, -1px); } }
  .pads-hint { margin-top: 6px; font-size: 12px; text-align: center; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 5; }
  #flash.go { animation: flash .4s ease-out; }
  #flash.ten { background: radial-gradient(circle, rgba(255,230,120,.1), rgba(255,200,40,.6)); }
  #flash.good { background: radial-gradient(circle, transparent 50%, color-mix(in srgb, var(--c) 70%, transparent)); }
  #flash.loose { background: color-mix(in srgb, var(--c) 18%, transparent); }
  @keyframes flash { from { opacity: .85; } to { opacity: 0; } }
  .debug { position: fixed; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 4px); font: 11px ui-monospace, monospace; color: rgba(255,255,255,.45); white-space: pre-wrap; pointer-events: none; z-index: 6; }
  .dtag { align-self: center; margin-left: 4px; padding: 2px 8px; border-radius: 999px; font: 800 11px/1.4 "Pretendard Variable", Pretendard, sans-serif; font-style: normal; color: #0b0f17; background: #8fd8ff; }
  .dtag[data-d="easy"] { background: #5ee07a; }
  .dtag[data-d="hard"] { background: #ff7a59; }

  /* 튜토리얼 안의 조작 */
  .pcgt .pcgt-card.gt-compact .pcgt-art { width: min(52vw, 190px, 22vh); }
  .gt-col { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  .gt-btn { width: min(100%, 340px); padding: 16px; border-radius: 16px; border: 0; background: var(--c); color: #0b0f17; font: 900 19px/1.1 "Pretendard Variable", Pretendard, sans-serif; box-shadow: 0 8px 26px color-mix(in srgb, var(--c) 35%, transparent); cursor: pointer; }
  .gt-note { margin: 0; font-size: 13px; color: var(--dim); text-align: center; }
  .gt-sight { position: relative; width: min(60vw, 190px); aspect-ratio: 1; margin: 0 auto; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); touch-action: none; }
  .gt-sight.drag { border-style: dashed; border-color: var(--c); }
  .gt-sight .dotp { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 14px var(--c); }
  .gt-sight .zone { position: absolute; display: grid; place-items: center; font-weight: 900; color: rgba(255,255,255,.55); background: rgba(255,255,255,.06); transition: background .25s; }
  .gt-sight .zone.on { background: color-mix(in srgb, var(--c) 50%, transparent); color: #fff; }
  .gt-sight .zone.on::after { content: " ✓"; font-size: 13px; }
  .gt-sight .zone.u { left: 32%; right: 32%; top: 2%; height: 20%; border-radius: 12px; }
  .gt-sight .zone.d { left: 32%; right: 32%; bottom: 2%; height: 20%; border-radius: 12px; }
  .gt-sight .zone.l { top: 32%; bottom: 32%; left: 2%; width: 20%; border-radius: 12px; }
  .gt-sight .zone.r { top: 32%; bottom: 32%; right: 2%; width: 20%; border-radius: 12px; }
  .gt-bow { width: min(80vw, 260px); height: min(34vh, 220px); position: relative; }
  .gt-bow .bowzone { position: absolute; inset: 0; margin: 0; }
  .gt-meter { width: min(80vw, 260px); height: 12px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
  .gt-meter i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 99px; }
</style>
</head>
<body>
<header>
  <span class="me" id="me">…</span>
  <span class="room" id="room"></span>
  <button class="recal hidden" id="btnRecal">다시 맞추기</button>
</header>
<div class="banner hidden" id="banner"></div>
<main>
  <section class="view center on" id="vStart">
    <div class="langbox" id="langBox"></div>
    <svg class="art aimart" viewBox="0 0 130 150" aria-hidden="true">
      <path d="M22 14Q65 60 108 14"/><path d="M22 14Q16 70 65 70Q114 70 108 14" style="stroke:#fff;stroke-width:2;stroke-dasharray:3 5;opacity:.6"/>
      <path d="M65 70V10"/><path d="M60 16L65 6L70 16"/><rect x="45" y="92" width="40" height="52" rx="9" style="stroke:#fff;fill:#08130d"/>
    </svg>
    <h1>폰이 활이 됩니다</h1>
    <p>폰으로 겨누고, 아래로 당겼다 놓아요.</p>
    <p class="note hidden" id="httpNote">https 주소가 아니라 센서가 꺼질 수 있어요.</p>
    <button class="primary" id="btnStart" style="margin-top:4px">시작하기</button>
  </section>

  <section class="view center" id="vMsg"><h1 id="msgT"></h1><p id="msgB"></p><button class="ghost hidden" id="btnMsg" style="max-width:280px"></button></section>

  <section class="view center wait" id="vWait">
    <div class="big" id="waitT">대기실</div>
    <p id="waitB"></p>
    <div class="chips" id="waitChips"></div>
    <div class="scorecard" id="scoreCard"></div>
    <div class="setbox" id="setBox"></div>
    <div class="readyrow hidden" id="readyRow"></div>
    <button class="primary go" id="btnGo">준비</button>
    <div id="tutLink"></div>
  </section>

  <section class="view" id="vPlay">
    <div class="hudrow">
      <div class="sc"><b id="score">0</b><span>총점 <i class="dtag" id="dTag" data-d="easy">쉬움</i></span></div>
      <div class="mid"><b id="endTxt">1엔드</b><span id="arrowTxt">3발</span><div class="arrowsleft" id="arrowsLeft"></div></div>
      <div class="windchip" id="windChip">
        <svg viewBox="-24 -24 48 48"><circle r="21" class="wc-bg"/><g id="wArrow"><path d="M-13 0H10M10 0l-6 -5M10 0l-6 5" class="wc-ar"/></g></svg>
        <b id="wSpd">0.0</b><span id="wWord">바람</span>
      </div>
    </div>
    <div class="status" id="status">곧 시작해요</div>
    <div class="sightwrap hidden" id="sightWrap"><div class="sight" id="sight"><div class="dotp" id="sightDot"></div></div><div class="sightlabel" id="sightLabel">조준</div></div>
    <div class="bowzone off" id="bowZone"></div>
    <button class="primary shootbtn" id="btnShoot" disabled>바로 쏘기</button>
    <p class="pads-hint hidden" id="fallbackHint"></p>
  </section>
</main>
<div id="flash"></div>
<div class="debug" id="debug"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/common/ready.js"></script>
<script type="module" src="/archery/i18n.js"></script>
<script type="module" src="/common/i18n-common.js"></script>
<script type="module" src="controller.js"></script>
</body>
</html>
