<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a">
<title>카트 컨트롤러</title>
<link rel="stylesheet" href="/vendor/pretendard/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/vendor/anton/index.css">
<style>
  :root { --c: #ff5a5f; --bg: #0b0d1a; --fg: #f4f4f8; --dim: #9ea7c0; --line: rgba(255,255,255,.14); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body { position: fixed; inset: 0; background: radial-gradient(90% 70% at 50% 0%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%), var(--bg); }
  .hidden { display: none !important; }

  /* 무대: 화면 회전 잠금과 상관없이, 폰을 실제로 쥔 방향에 맞춰 통째로 돌립니다(controller.js 가 크기·각도를 정함). */
  #stage { position: fixed; left: 50%; top: 50%; width: 100vw; height: 100vh; transform: translate(-50%, -50%); transform-origin: 50% 50%;
    --sat: env(safe-area-inset-top); --sar: env(safe-area-inset-right); --sab: env(safe-area-inset-bottom); --sal: env(safe-area-inset-left);
    padding: var(--sat) var(--sar) var(--sab) var(--sal); overflow: hidden; }
  #stage.anim { transition: transform .38s cubic-bezier(.3,1.2,.4,1); }
  .stage-in { position: relative; width: 100%; height: 100%; }

  .banner { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 5; max-width: 80%; padding: 7px 14px; border-radius: 12px;
    background: rgba(255,90,95,.2); color: #ffc1c3; font-size: 13px; text-align: center; }
  .view { position: absolute; inset: 0; display: none; padding: 10px 16px; }
  .view.on { display: flex; }
  .center { align-items: center; justify-content: center; text-align: center; flex-direction: column; gap: 10px; }
  h1 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -.03em; }
  p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.5; white-space: pre-line; }
  .note { font-size: 12px; color: #ffcf8a; }
  .me { font-family: Anton, Impact, sans-serif; font-size: 22px; padding: 2px 14px; border-radius: 999px; background: var(--c); color: #0b0f17; display: inline-block; }
  button { font: inherit; color: inherit; border: 0; }
  .primary { padding: 14px 30px; border-radius: 16px; background: var(--c); color: #0b0f17; font-size: 19px; font-weight: 900; min-width: 160px;
    box-shadow: 0 8px 24px color-mix(in srgb, var(--c) 35%, transparent); }
  .primary:disabled { opacity: .5; }
  .primary.waiting { background: rgba(255,255,255,.1); color: var(--fg); box-shadow: inset 0 0 0 2px var(--c); }
  .ghost { padding: 10px 18px; border-radius: 14px; background: rgba(255,255,255,.08); border: 1.5px solid var(--line); font-size: 14px; font-weight: 800; }
  .row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .big { font-family: Anton, Impact, "Pretendard Variable", sans-serif; font-size: 52px; line-height: 1; }
  .big.win { color: #ffd23a; }
  .chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid var(--line);
    font-size: 12.5px; font-weight: 700; color: #d8dfeb; }
  .chip svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* 시작 화면 */
  .phone-art { width: 150px; height: 96px; }
  .phone-art .ph { animation: hold 3.2s ease-in-out infinite; transform-origin: 75px 48px; }
  @keyframes hold { 0%, 20% { transform: rotate(-90deg) scale(.62); } 45%, 100% { transform: none; } }

  /* 대기실: 세로면 한 줄, 가로면 왼쪽 안내 + 오른쪽 설정 */
  #vWait { align-items: center; justify-content: center; gap: 14px; flex-direction: column; overflow-y: auto; }
  .wait-main { display: flex; flex-direction: column; align-items: center; gap: 9px; text-align: center; width: 100%; max-width: 420px; }
  .wait-side { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 8px; }
  .mode-note { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid var(--line);
    font-size: 12.5px; font-weight: 700; color: #c9d3e3; line-height: 1.35; }
  .mode-note i { flex: none; width: 30px; height: 30px; display: grid; place-items: center; }
  .mode-note i svg { width: 28px; height: 28px; }
  .mode-note:empty { display: none; }
  #stage.land #vWait { flex-direction: row; align-items: center; gap: 22px; padding: 10px 22px; }
  #stage.land .wait-main { flex: 1 1 0; max-width: none; }
  #stage.land .wait-side { flex: 1 1 0; max-width: 400px; }
  #stage.land #vWait h1 { font-size: 21px; }
  #stage.land #vWait .primary { padding: 12px 26px; font-size: 18px; }

  /* 핸들 그림 */
  .wheel { width: 120px; height: 120px; }
  .wheel svg { width: 100%; height: 100%; overflow: visible; }
  .rot { transform-origin: 50% 50%; transition: transform .04s linear; }
  .bar { width: 220px; max-width: 90%; height: 10px; border-radius: 6px; background: rgba(255,255,255,.1); position: relative; }
  .bar i { position: absolute; top: -4px; width: 4px; height: 18px; left: 50%; margin-left: -2px; border-radius: 2px; background: var(--c); }
  .bar b { position: absolute; left: 50%; top: -2px; width: 2px; height: 14px; background: rgba(255,255,255,.4); }
  .cal-row { display: flex; align-items: center; gap: 22px; }
  .cal-col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  #stage.port .cal-row { flex-direction: column; gap: 14px; }
  .hold-hint { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(255,207,138,.12); color: #ffcf8a; font-size: 13px; font-weight: 800; }
  .hold-hint svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; animation: turn 2.2s ease-in-out infinite; }
  @keyframes turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }

  /* 경기 중: 가로면 왼쪽 브레이크 · 가운데 핸들 · 오른쪽 액셀, 세로면 위 핸들 · 아래 두 페달 */
  #vPlay { padding: 10px 12px; gap: 12px; display: none; }
  #vPlay.on { display: grid; }
  #stage.land #vPlay { grid-template-columns: 30% minmax(0, 1fr) 30%; grid-template-areas: "brake mid gas"; }
  #stage.port #vPlay { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr) 34%; grid-template-areas: "mid mid" "brake gas"; }
  #pBrake { grid-area: brake; }
  #pGas { grid-area: gas; }
  .mid { grid-area: mid; }
  .pedal { border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 0; min-height: 0;
    font-weight: 900; font-size: clamp(20px, 6vmin, 38px); letter-spacing: -.02em; touch-action: none; transition: transform .05s, filter .05s; position: relative; overflow: hidden; }
  .pedal small { font-size: 13px; font-weight: 700; opacity: .75; letter-spacing: 0; }
  .pedal svg { width: clamp(40px, 14vmin, 84px); height: clamp(40px, 14vmin, 84px); fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  #pBrake { background: linear-gradient(180deg, #ff6a74, #c8283a); color: #fff; box-shadow: 0 10px 0 #7d1522; }
  #pGas { background: linear-gradient(180deg, #4be58a, #1b9e55); color: #04210f; box-shadow: 0 10px 0 #0c5e31; }
  .pedal.down { transform: translateY(8px); filter: brightness(1.18); }
  #pBrake.down { box-shadow: 0 2px 0 #7d1522; }
  #pGas.down { box-shadow: 0 2px 0 #0c5e31; }
  .mid { min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; position: relative; }
  .mid .top { display: flex; align-items: center; gap: 8px; }
  .mid .status { font-weight: 900; font-size: clamp(14px, 4.4vmin, 22px); color: var(--fg); min-height: 1.3em; white-space: nowrap; }
  .mid .sub { font-size: 12px; color: var(--dim); min-height: 1.2em; }
  .mid .cd { position: absolute; inset: 0; display: grid; place-items: center; font-family: Anton, Impact, sans-serif; font-size: min(22vmin, 150px); color: #fff;
    text-shadow: 0 0 30px var(--c); pointer-events: none; opacity: 0; z-index: 3; }
  .mid .cd.on { opacity: 1; animation: pop .5s cubic-bezier(.2,1.5,.4,1); }
  @keyframes pop { from { transform: scale(1.6); opacity: 0; } }
  .mid.fallback .slide { display: block; }
  .slide { display: none; width: 92%; height: 50px; border-radius: 25px; background: rgba(255,255,255,.08); border: 1.5px dashed var(--line); position: relative; touch-action: none; flex: none; }
  .slide i { position: absolute; top: 4px; left: 50%; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; background: var(--c); }
  .slide em { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-size: 11.5px; color: var(--dim); pointer-events: none; }

  /* 핸들 바퀴 + 가운데 아이템 버튼 */
  .hub { position: relative; width: min(46vmin, 190px); aspect-ratio: 1; flex: none; display: grid; place-items: center; }
  .mid.fallback .hub { width: min(34vmin, 150px); }
  .hub > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .itembtn { position: relative; width: 56%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; touch-action: none;
    background: radial-gradient(circle at 50% 35%, #2b3352, #121729 70%); box-shadow: inset 0 0 0 3px rgba(255,255,255,.18), 0 6px 18px rgba(0,0,0,.4); }
  .itembtn .ico { width: 64%; height: 64%; display: grid; place-items: center; }
  .itembtn .ico svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 5px rgba(0,0,0,.5)); }
  .ilbl { min-height: 1.3em; white-space: nowrap; font-size: 12.5px; font-weight: 800; color: var(--dim); margin-top: -2px; }
  .ilbl.have { color: #ffd23a; }
  .ilbl.off { color: #8fd8ff; }
  .itembtn.none .ico { opacity: .28; filter: grayscale(1); }
  .itembtn.roll { box-shadow: inset 0 0 0 3px #fff, 0 0 26px rgba(255,230,120,.6); }
  .itembtn.roll .ico { animation: reel .1s linear infinite; }
  @keyframes reel { 0% { transform: translateY(-14%); opacity: .5; } 50% { opacity: 1; } 100% { transform: translateY(14%); opacity: .5; } }
  .itembtn.have { background: radial-gradient(circle at 50% 35%, #4a3d12, #1c1606 72%); box-shadow: inset 0 0 0 3px #ffd23a, 0 0 0 6px rgba(255,210,58,.22), 0 0 30px rgba(255,210,58,.55);
    animation: ready 1s ease-in-out infinite alternate; }
    .itembtn.used { animation: used .45s ease-out; }
  @keyframes ready { to { box-shadow: inset 0 0 0 3px #ffd23a, 0 0 0 10px rgba(255,210,58,.12), 0 0 40px rgba(255,210,58,.75); } }
  @keyframes used { 0% { transform: scale(.86); } 60% { transform: scale(1.08); } 100% { transform: none; } }
  .itembtn.off { background: radial-gradient(circle at 50% 35%, #2b3352, #121729 70%); }
  .itembtn.off .ico { opacity: 1; filter: none; }
  .chase-p { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 6px; border-radius: 999px; font-size: 12.5px; font-weight: 900; color: #fff;
    background: linear-gradient(90deg, #543eff, #2878ff); box-shadow: 0 0 18px rgba(110,90,255,.6); opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s; }
  .chase-p.on { opacity: 1; transform: none; }
  .chase-p i { width: 20px; height: 20px; display: block; }
  .chase-p i svg { width: 100%; height: 100%; display: block; }
  #stage.port .mid .hub { width: min(56vmin, 230px); }

  #flash { position: absolute; inset: 0; pointer-events: none; background: var(--c); opacity: 0; z-index: 9; }
  #flash.go { animation: flash .5s ease-out; }
  @keyframes flash { from { opacity: .6; } to { opacity: 0; } }
  .debug { position: absolute; left: 8px; right: 8px; bottom: 4px; font: 11px ui-monospace, monospace; color: rgba(255,255,255,.45); white-space: pre-wrap; pointer-events: none; z-index: 30; }

  /* 튜토리얼(공통 모듈) 을 돌린 무대 안에서: 화면(viewport) 기준이 아니라 무대 모양에 맞춰 배치합니다. */
  #stage .pcgt { padding: 12px 18px 14px; }
  #stage.land .pcgt { padding: 8px 20px 10px; }
  #stage.land .pcgt-card { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-auto-rows: min-content; align-content: center; column-gap: 22px; row-gap: 5px; text-align: left; }
  #stage.land .pcgt-art { grid-row: 1 / span 6; width: min(calc(var(--sw, 844px) * .36), calc(var(--sh, 390px) * .66), 330px); }
  #stage.land .pcgt-card > :not(.pcgt-art) { grid-column: 2; }
  #stage.land .pcgt-status { justify-content: flex-start; }
  #stage.land .pcgt-title { font-size: 24px; }
  #stage.land .pcgt-body { font-size: 14.5px; }
  #stage.land .pcgt-bottom { flex-direction: row; justify-content: flex-end; min-height: 0; }
  #stage.land .pcgt-next { width: auto; padding: 12px 30px; font-size: 17px; }
  #stage.port .pcgt-card { display: flex; flex-direction: column; text-align: center; }
  #stage.port .pcgt-art { width: min(74%, 300px, calc(var(--sh, 800px) * .3)); }
  #stage.port .pcgt-status { justify-content: center; }
  #stage.port .pcgt-bottom { flex-direction: column; justify-content: flex-end; min-height: 56px; }
  #stage.port .pcgt-next { width: 100%; padding: 18px; font-size: 20px; }
  #stage.port .pcgt-card > * { grid-column: auto; }
  /* 튜토리얼 안의 연습용 페달·게이지·아이템 버튼 */
  .tk { width: 100%; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .tk-gauge { position: relative; height: 34px; border-radius: 17px; background: rgba(255,255,255,.08); border: 1.5px solid var(--line); touch-action: none; }
  .tk-gauge b { position: absolute; top: 3px; bottom: 3px; left: 50%; width: 2px; background: rgba(255,255,255,.35); }
  .tk-gauge i { position: absolute; top: 3px; width: 26px; height: 26px; margin-left: -13px; left: 50%; border-radius: 50%; background: var(--c); box-shadow: 0 0 14px var(--c); }
  .tk-gauge .goal { position: absolute; top: 0; bottom: 0; width: 22%; border-radius: 17px; background: color-mix(in srgb, var(--c) 22%, transparent); border: 1.5px dashed var(--c); }
  .tk-gauge em { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-size: 11px; color: var(--dim); pointer-events: none; }
  .tk-pedals { display: flex; gap: 12px; height: 84px; }
  .tk-pedals button { flex: 1; border-radius: 18px; font-weight: 900; font-size: 18px; position: relative; overflow: hidden; touch-action: none; }
  .tk-pedals .b { background: linear-gradient(180deg, #ff6a74, #c8283a); color: #fff; box-shadow: 0 6px 0 #7d1522; }
  .tk-pedals .g { background: linear-gradient(180deg, #4be58a, #1b9e55); color: #04210f; box-shadow: 0 6px 0 #0c5e31; }
  .tk-pedals button.dim { opacity: .45; }
  .tk-pedals button.down { transform: translateY(5px); box-shadow: none; }
  .tk-pedals button s { position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: rgba(255,255,255,.85); text-decoration: none; }
  .tk-item { align-self: center; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; touch-action: none;
    background: radial-gradient(circle at 50% 35%, #4a3d12, #1c1606 72%); box-shadow: inset 0 0 0 3px #ffd23a, 0 0 28px rgba(255,210,58,.55); animation: ready 1s ease-in-out infinite alternate; }
  .tk-item span { width: 62%; height: 62%; display: grid; place-items: center; }
  .tk-item span svg { width: 100%; height: 100%; }
  .tk-item.fly span { animation: fly .6s ease-in forwards; }
  @keyframes fly { to { transform: translate(0, -60px) scale(.4) rotate(160deg); opacity: 0; } }
  .tut-link-wrap { display: flex; justify-content: center; }
</style>
</head>
<body>
<div id="stage"><div class="stage-in">
<div class="banner hidden" id="banner"></div>

<!-- 처음 -->
<section class="view center on" id="vStart">
  <svg class="phone-art" viewBox="0 0 150 96" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="ph">
    <rect x="19" y="16" width="112" height="64" rx="12" fill="#0b0f17" stroke="#fff" stroke-width="3"/>
    <circle cx="75" cy="48" r="20" stroke="var(--c)" stroke-width="5"/>
    <circle cx="75" cy="48" r="5" fill="var(--c)"/>
    <path d="M75 28v8M58 58l7-4M92 58l-7-4" stroke="var(--c)" stroke-width="4"/>
  </g></svg>
  <h1>폰이 카트 핸들이 됩니다</h1>
  <p>폰을 가로로 세워 양손으로 잡고 핸들처럼 기울여요.
왼쪽 엄지는 브레이크, 오른쪽 엄지는 액셀.</p>
  <div class="chips">
    <span class="chip"><svg viewBox="0 0 24 24"><rect x="5" y="9" width="14" height="11" rx="2"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>화면 회전 잠금, 그대로 둬도 돼요</span>
  </div>
  <p class="note hidden" id="httpNote">https 주소가 아니라서 동작 센서가 꺼질 수 있어요. 그때는 화면 가운데를 밀어서 조향해요.</p>
  <button class="primary" id="btnStart">시작하기</button>
</section>

<!-- 메시지 -->
<section class="view center" id="vMsg"><h1 id="msgT"></h1><p id="msgB"></p></section>

<!-- 대기실 · 경기 끝 · 관전 -->
<section class="view" id="vWait">
  <div class="wait-main">
    <div class="row"><span class="me" id="me">…</span><span class="big hidden" id="waitBig"></span></div>
    <h1 id="waitT">대기실</h1>
    <p id="waitB"></p>
    <div class="row">
      <button class="ghost" id="btnCal">핸들 맞추기</button>
      <button class="primary" id="btnReady">준비</button>
    </div>
    <div class="tut-link-wrap" id="tutLink"></div>
  </div>
  <div class="wait-side">
    <div id="setBox"></div>
    <div class="mode-note" id="modeNote"></div>
  </div>
</section>

<!-- 핸들 맞추기 -->
<section class="view center" id="vCal">
  <div class="cal-row">
    <div class="wheel"><svg viewBox="0 0 100 100" fill="none" stroke-linecap="round"><g class="rot" id="calWheel">
      <circle cx="50" cy="50" r="40" stroke="#fff" stroke-width="9"/>
      <path d="M50 50V13M50 50L19 68M50 50L81 68" stroke="#fff" stroke-width="7"/>
      <circle cx="50" cy="50" r="9" fill="var(--c)" stroke="none"/>
      <rect x="46" y="4" width="8" height="12" rx="2" fill="#ffd23a" stroke="none"/>
    </g></svg></div>
    <div class="cal-col">
      <h1 id="calT">핸들 맞추기</h1>
      <p id="calB">폰을 가로로 세워, 핸들을 똑바로 잡은 자세에서
영점 맞추기를 누르세요. 그 자세가 직진이에요.</p>
      <div class="hold-hint hidden" id="holdHint"><svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="2"/></svg>폰을 가로로 눕혀 핸들처럼 잡아요</div>
      <div class="bar"><b></b><i id="calBar"></i></div>
      <div class="row">
        <button class="ghost" id="btnZero">영점 맞추기</button>
        <button class="primary" id="btnCalDone" style="padding:10px 22px;font-size:16px;min-width:0">완료</button>
      </div>
    </div>
  </div>
</section>

<!-- 경기 중 -->
<section class="view" id="vPlay">
  <button class="pedal" id="pBrake" aria-label="브레이크"><svg viewBox="0 0 48 48"><rect x="10" y="10" width="28" height="28" rx="6"/></svg>브레이크<small>왼쪽 엄지</small></button>
  <div class="mid" id="mid">
    <div class="top"><span class="me" id="meP">…</span><span class="status" id="status">달릴 준비</span></div>
    <div class="hub">
      <svg viewBox="0 0 100 100" fill="none" stroke-linecap="round" aria-hidden="true"><g class="rot" id="wheel">
        <circle cx="50" cy="50" r="44" stroke="#fff" stroke-width="7"/>
        <circle cx="50" cy="50" r="44" stroke="var(--c)" stroke-width="2" opacity=".55"/>
        <path d="M50 6v12M12 72l10-6M88 72l-10-6" stroke="#fff" stroke-width="6"/>
