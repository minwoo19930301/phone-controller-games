<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<title>홈런 더비 컨트롤러</title>
<style>
  :root { --c: #ff5a5f; --bg: #0d1b2a; --fg: #f4f1ea; --dim: #8fa3b8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    overscroll-behavior: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; }
  .badge { font-weight: 800; font-size: 20px; padding: 6px 14px; border-radius: 999px; background: var(--c); color: #111; }
  .room { color: var(--dim); font-size: 14px; letter-spacing: .08em; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; }
  h1 { font-size: 34px; margin: 0; line-height: 1.2; }
  p { margin: 0; white-space: pre-line; color: var(--dim); font-size: 17px; line-height: 1.5; }
  button { font: inherit; font-weight: 800; font-size: 22px; border: 0; border-radius: 18px; padding: 20px 28px;
    background: var(--c); color: #111; width: 100%; max-width: 360px; }
  button.ghost { background: transparent; color: var(--fg); border: 2px solid #33475b; font-size: 18px; padding: 14px; }
  .hidden { display: none !important; }
  .bat { width: 120px; height: 120px; border-radius: 50%; border: 6px solid var(--c); display: grid; place-items: center;
    font-size: 56px; transition: transform .15s; }
  .flash { animation: flash .5s; }
  @keyframes flash { 0% { background: var(--c); } 100% { background: var(--bg); } }
  .result { font-size: 44px; font-weight: 900; }
  .meter { width: 100%; max-width: 360px; height: 14px; border-radius: 7px; background: #1d3044; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--c); transition: width .2s; }
  .stats { display: flex; gap: 22px; color: var(--dim); font-size: 15px; }
  .stats b { display: block; color: var(--fg); font-size: 26px; }
</style>
</head>
<body>
<header>
  <span class="badge" id="badge">…</span>
  <span class="room" id="room"></span>
</header>
<main id="main">
  <div id="vStart">
    <h1>홈런 더비</h1>
    <p style="margin:14px 0 26px">폰이 방망이가 됩니다.<br>두 손으로 세로로 쥐고 휘두르세요.</p>
    <button id="btnStart">시작하기</button>
  </div>

  <div id="vMsg" class="hidden">
    <h1 id="msgTitle"></h1>
    <p id="msgBody"></p>
  </div>

  <div id="vPlay" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:18px">
    <div class="bat" id="bat">⚾</div>
    <div class="result" id="result">준비</div>
    <p id="hint"></p>
    <div class="meter"><i id="power"></i></div>
    <div class="stats">
      <div>남은 공<b id="sLeft">-</b></div>
      <div>홈런<b id="sHr">0</b></div>
      <div>최장<b id="sLong">-</b></div>
    </div>
    <button id="btnGo" class="hidden">게임 시작</button>
    <button id="btnTest" class="ghost hidden">테스트 스윙 (센서 없음)</button>
    <p id="sensorHelp" class="hidden" style="font-size:13px">센서로 치려면 — iPhone: Safari 를 앱 전환기에서 완전히 닫고 QR을 다시 찍은 뒤 동작 접근을 허용해요. Android: 주소창 자물쇠 → 사이트 설정 → 동작 센서 허용.</p>
  </div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const ROOM = (params.get('room') || '').toUpperCase();
$('room').textContent = ROOM ? `방 ${ROOM}` : '';

let token = null;
try { token = localStorage.getItem('pcg-token'); } catch (e) {}
if (!token) {
  token = Math.random().toString(36).slice(2) + Date.now().toString(36);
  try { localStorage.setItem('pcg-token', token); } catch (e) {}
}

const socket = io({ autoConnect: false, transports: ['websocket', 'polling'], tryAllTransports: true });
// 끊겨 있으면 보내지 않습니다(다시 붙을 때 join 보다 먼저 흘러가 버려짐).
function send(event, data) {
  if (!socket.connected) return false;
  socket.emit('c2d', { event, data });
  return true;
}
let noRoomTries = 0;
// 큰 화면이 이 폰이 살아 있는지 알 수 있게 1초마다 신호를 보냅니다.
setInterval(() => { if (me) send('ready', {}); }, 1000);
function keepAwake() {
  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
}
let me = null;
let state = { phase: 'lobby' };
let started = false;
let gotMotion = false;

function show(view) {
  for (const v of ['vStart', 'vMsg', 'vPlay']) $(v).classList.toggle('hidden', v !== view);
}
function message(title, body) {
  $('msgTitle').textContent = title;
  $('msgBody').textContent = body || '';
  show('vMsg');
}

// ---------- 서버까지 왕복 시간 ----------
const rtts = [];
function measureRtt() {
  if (!socket.connected) return;
  const t0 = performance.now();
  socket.timeout(2000).emit('ping_rtt', t0, (err) => {
    if (err) return;
    rtts.push(performance.now() - t0);
    if (rtts.length > 7) rtts.shift();
  });
}
function rtt() {
  if (!rtts.length) return 80;
  const s = [...rtts].sort((a, b) => a - b);
  return s[Math.floor(s.length / 2)];
}
setInterval(measureRtt, 1500);

// ---------- 소리·진동 ----------
let actx = null;
function audio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function crack(strength) {
  const a = audio();
  if (!a) return;
  const len = Math.floor(a.sampleRate * 0.09);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 6);
  const src = a.createBufferSource();
  src.buffer = buf;
  const f = a.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 0.8;
  const g = a.createGain();
  g.gain.value = 0.5 + strength;
  src.connect(f).connect(g).connect(a.destination);
  src.start();
}
function buzz(ms) {
  if (navigator.vibrate) navigator.vibrate(ms);
  document.body.classList.remove('flash');
  void document.body.offsetWidth;
  document.body.classList.add('flash');
}

// ---------- 스윙 감지 ----------
// 회전 속도(도/초)가 문턱을 넘으면 스윙 시작으로 보고, 직후 120ms 동안 가장 센 값을 힘으로 씁니다.
const TRIGGER_DEG = 380;
const COOLDOWN_MS = 600;
const REAL_SWING_DEG = 650; // 창 안 최댓값이 이보다 작으면 준비 동작으로 보고 버립니다
const ACC_TRIGGER = 22; // 자이로가 없는 폰은 가속도로 잡습니다(m/s²)
let swingAt = 0;
let window_ = null;
let hasGyro = false;

function onMotion(e) {
  const r = e.rotationRate;
  const acc = e.acceleration;
  const gyro = r && (r.alpha != null || r.beta != null || r.gamma != null);
  if (gyro) hasGyro = true;
  if (!gyro && !(acc && acc.x != null)) return;
  // 자이로가 있거나 가속도가 들어올 때만 센서가 있다고 봅니다.
  gotMotion = true;
  const rot = gyro ? Math.hypot(r.alpha || 0, r.beta || 0, r.gamma || 0) : 0;
  const a = acc ? Math.hypot(acc.x || 0, acc.y || 0, acc.z || 0) : 0;
  const now = performance.now();
  if (window_) {
    if (rot > window_.rot || (!hasGyro && a > window_.acc)) window_.peakT = now;
    window_.rot = Math.max(window_.rot, rot);
    window_.acc = Math.max(window_.acc, a);
    return;
  }
  const trig = hasGyro ? rot > TRIGGER_DEG : a > ACC_TRIGGER;
  if (trig && now - swingAt > COOLDOWN_MS) {
    swingAt = now;
    window_ = { start: now, peakT: now, rot, acc: a };
    setTimeout(() => {
      const w = window_;
      window_ = null;
      // 백스윙·로드 같은 느린 동작이면 보내지 않고 쿨다운도 풀어서 진짜 스윙을 놓치지 않게 합니다.
      const real = hasGyro ? w.rot > REAL_SWING_DEG : w.acc > ACC_TRIGGER + 6;
      if (!real) {
        swingAt = 0;
        return;
      }
      // 회전 1500도/초, 가속 35m/s² 정도면 아주 센 스윙입니다.
      const rotPart = hasGyro ? Math.min(1, (w.rot - TRIGGER_DEG) / 1100) : Math.min(1, w.acc / 40);
      const p = Math.min(1, 0.55 * rotPart + 0.45 * Math.min(1, w.acc / 35));
      // 판정 시각은 가장 세게 돈 순간(정점)으로 보냅니다.
      sendSwing(Math.max(0.15, p), performance.now() - w.peakT, Math.round(w.rot));
    }, 90);
  }
}

function sendSwing(power, ago, peak) {
  send('swing', { power, ago, rtt: rtt(), peak });
  $('power').style.width = `${Math.round(power * 100)}%`;
  $('bat').style.transform = 'rotate(-35deg)';
  setTimeout(() => ($('bat').style.transform = ''), 250);
}

// ---------- 화면 갱신 ----------
function render() {
  if (!me) return;
  const phase = state.phase;
  const myTurn = state.batter === me.slot;
  $('btnGo').classList.toggle('hidden', !(phase === 'lobby' || phase === 'over'));
  $('btnGo').textContent = phase === 'over' ? '다시 하기' : '게임 시작';
  const mine = (state.scores || {})[me.slot];
  $('sHr').textContent = mine ? mine.hr : 0;
  $('sLong').textContent = mine && mine.longest ? `${mine.longest}m` : '-';
  $('sLeft').textContent = myTurn && state.left != null ? state.left : '-';
  if (phase === 'lobby') {
    $('result').textContent = '대기실';
    $('hint').textContent = '모두 들어오면 게임 시작을 누르세요.';
  } else if (phase === 'over') {
    $('result').textContent = '경기 끝';
    $('hint').textContent = '큰 화면에서 순위를 확인하세요.';
  } else if (myTurn) {
    if (!$('result').dataset.keep) $('result').textContent = '내 차례!';
    $('hint').textContent = '투수가 공을 던지면 휘두르세요.';
  } else {
    $('result').textContent = state.batter ? `${state.batter}P 차례` : '대기';
    $('hint').textContent = '내 차례를 기다려요.';
  }
}

socket.on('connect', () => {
  measureRtt();
  socket.emit('join', { role: 'controller', room: ROOM, token });
});
socket.on('assigned', (p) => {
  // 다른 종목 방이면 그 종목의 컨트롤러로 보냅니다.
  if (p.game && p.game !== 'baseball') {
    location.replace(`/play/${p.game}/?room=${ROOM}`);
    return;
  }
  me = p;
  noRoomTries = 0;
  document.documentElement.style.setProperty('--c', p.color);
  $('badge').textContent = p.name;
  show('vPlay');
  render();
});
socket.on('no_room', () => {
  // 서버가 막 다시 떴으면 큰 화면이 같은 코드로 방을 다시 만들 때까지 잠깐 기다립니다.
  if (noRoomTries++ < 15) {
    message('방에 다시 연결하는 중', '잠시만 기다려 주세요.');
    setTimeout(() => socket.connected && socket.emit('join', { role: 'controller', room: ROOM, token }), 2000);
    return;
  }
  message('방을 찾을 수 없어요', '큰 화면의 QR을 다시 찍어 주세요.');
});
socket.on('room_full', () => message('4명이 꽉 찼어요', '빈자리가 생기면 다시 찍어 주세요.'));
socket.on('replaced', () => message('다른 탭에서 열었어요', '마지막으로 연 화면에서 조작해요.'));
socket.on('room_closed', () => message('방이 닫혔어요', '큰 화면의 새 QR을 찍어 주세요.'));
socket.on('display_status', ({ connected }) => {
  if (!connected && me) $('hint').textContent = '큰 화면이 꺼져 있어요.';
});
socket.on('game_state', (s) => { state = s; delete $('result').dataset.keep; render(); });
socket.on('pitch', (p) => {
  $('result').dataset.keep = '1';
  $('result').textContent = p.label || '투구!';
  if (navigator.vibrate) navigator.vibrate(20);
});
socket.on('result', (r) => {
  $('result').dataset.keep = '1';
  $('result').textContent = r.text;
  if (r.contact) {
    crack(r.quality || 0.5);
    buzz(r.homer ? [100, 60, 160] : 100);
  }
  setTimeout(() => { delete $('result').dataset.keep; }, 2500);
});

$('btnStart').addEventListener('click', async () => {
  // 화면 꺼짐 방지와 권한 요청은 탭 안에서 await 전에 바로 불러야 iPhone 에서 통합니다.
  keepAwake();
  audio();
  // iPhone 은 탭 안에서 바로 권한을 물어야 합니다.
  const DM = window.DeviceMotionEvent;
  if (DM && typeof DM.requestPermission === 'function') {
    // 거절돼도 버튼 스윙으로는 할 수 있게 계속 진행합니다.
    let res = 'denied';
    try { res = await DM.requestPermission(); } catch (e) {}
    if (res !== 'granted') {
      $('btnTest').textContent = '동작 권한이 없어요 · 눌러서 스윙';
      $('btnTest').classList.remove('hidden');
      $('sensorHelp').classList.remove('hidden');
    }
  }
  window.addEventListener('devicemotion', onMotion);
  started = true;
  if (!ROOM) { message('방 코드가 없어요', '큰 화면의 QR을 찍어 주세요.'); return; }
  socket.connect();
  // 1.5초 동안 센서 값이 안 들어오면(PC, http 주소) 버튼으로 스윙합니다.
  setTimeout(() => { if (!gotMotion) $('btnTest').classList.remove('hidden'); }, 1500);
});
$('btnGo').addEventListener('click', () => {
  keepAwake();
  send('start_game', {});
});
$('btnTest').addEventListener('click', () => sendSwing(0.85, 0, 0));
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && started && navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
});
</script>
</body>
</html>
