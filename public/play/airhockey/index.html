<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0918">
<title>에어하키 컨트롤러</title>
<link rel="stylesheet" href="/vendor/pretendard/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/vendor/anton/index.css">
<style>
  :root { --c: #ff5a5f; --t: #ff5a5f; --o: #3ab4ff; --bg: #0b0918; --fg: #f5f3ff; --dim: #a9a2c6; --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body { display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 12px);
    background: radial-gradient(120% 55% at 50% 0%, color-mix(in srgb, var(--c) 20%, transparent), transparent 70%),
      radial-gradient(90% 40% at 50% 100%, rgba(124, 92, 255, .18), transparent 70%), var(--bg); }
  header { display: flex; align-items: center; gap: 10px; height: 44px; flex: none; }
  .me { font-family: Anton, Impact, sans-serif; font-size: 26px; padding: 2px 14px; border-radius: 999px; background: var(--c); color: #0b0f17; }
  .room { flex: 1; color: var(--dim); font-size: 13px; letter-spacing: .1em; }
  .flip { padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.07); color: var(--fg); border: 1.5px solid var(--line);
    font-size: 13px; font-weight: 800; }
  .flip.on { border-color: var(--c); color: var(--c); }
  .hidden { display: none !important; }
  .banner { margin: 6px 0 0; padding: 9px 12px; border-radius: 12px; background: rgba(255,90,95,.14); color: #ffb3b5; font-size: 13px; text-align: center; flex: none; }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .view { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .view.on { display: flex; }
  .center { align-items: center; justify-content: center; text-align: center; gap: 14px; }
  h1 { margin: 0; font-size: 30px; line-height: 1.25; letter-spacing: -.02em; }
  p { margin: 0; color: var(--dim); font-size: 16px; line-height: 1.55; white-space: pre-line; }
  button { font: inherit; border: 0; cursor: pointer; }
  .primary { width: 100%; padding: 19px; border-radius: 18px; background: var(--c); color: #0b0f17; font-size: 21px; font-weight: 800; }
  .ghost { width: 100%; padding: 13px; border-radius: 16px; background: transparent; color: var(--fg); border: 1.5px solid var(--line); font-size: 15px; font-weight: 700; }
  .art { width: 170px; height: 200px; }
  .big { font-size: 42px; font-weight: 900; letter-spacing: -.03em; }
  .big.win { color: var(--c); text-shadow: 0 0 30px color-mix(in srgb, var(--c) 50%, transparent); }
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .chip { padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.07); font-size: 14px; color: var(--dim); }
  .chip b { color: var(--fg); font-size: 17px; margin-left: 4px; }
  .side { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.06);
    border: 1px solid var(--line); font-weight: 800; font-size: 15px; }
  .side i { width: 10px; height: 10px; border-radius: 50%; background: var(--t); box-shadow: 0 0 10px var(--t); }

  /* 경기 */
  .score { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin: 6px 0 8px;
    padding: 8px 12px; border-radius: 18px; background: rgba(255,255,255,.05); border: 1px solid var(--line); }
  .score .s { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .score .s span { font-size: 12px; color: var(--dim); font-weight: 800; white-space: nowrap; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; }
  .score .s b { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 40px; line-height: 1.05; }
  .score .s.mine b { color: var(--t); }
  .score .s.opp b { color: var(--o); }
  .score .s b.bump { animation: bump .7s cubic-bezier(.2,1.6,.4,1); }
  .score .mid { display: flex; flex-direction: column; align-items: center; color: var(--dim); font-size: 11px; font-weight: 800; letter-spacing: .06em; }
  .score .mid em { font-style: normal; font-family: Anton, Impact, sans-serif; font-size: 24px; color: rgba(255,255,255,.3); line-height: 1; }
  @keyframes bump { from { transform: scale(1.6); } }
  .padbox { position: relative; flex: 1; min-height: 0; border-radius: 22px; overflow: hidden; touch-action: none; }
  .padbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .over { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .over.on { opacity: 1; }
  .over b { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 84px; color: #fff; letter-spacing: .02em;
    text-shadow: 0 0 24px var(--c), 0 6px 30px rgba(0,0,0,.6); -webkit-text-stroke: 2px var(--c); }
  .over.bad b { -webkit-text-stroke: 0; color: #e8e6f2; font-family: inherit; font-weight: 900; font-size: 56px; text-shadow: 0 6px 30px rgba(0,0,0,.7); }
  .status { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px;
    background: rgba(11,9,24,.78); border: 1px solid var(--line); font-weight: 800; font-size: 14px; white-space: nowrap; pointer-events: none; }
  .status:empty { display: none; }
  .tip { flex: none; text-align: center; font-size: 13px; color: var(--dim); margin-top: 8px; min-height: 18px; }
  .tools { flex: none; display: flex; gap: 8px; margin-top: 8px; }
  .tools button { flex: 1; padding: 11px; border-radius: 14px; background: rgba(255,255,255,.07); color: var(--fg); border: 1.5px solid var(--line);
    font-size: 14px; font-weight: 800; }
  .tools button.on { background: var(--c); color: #0b0f17; border-color: var(--c); }
  .debug { position: fixed; left: 8px; bottom: calc(env(safe-area-inset-bottom) + 2px); font: 11px ui-monospace, monospace; color: rgba(255,255,255,.4); pointer-events: none; }
  .flash { animation: flash .45s; }
  @keyframes flash { from { box-shadow: inset 0 0 0 6px var(--c), 0 0 40px var(--c); } }
</style>
</head>
<body>
<header>
  <span class="me" id="me">…</span><span class="room" id="room"></span>
  <button class="flip hidden" id="btnFlip">↕ 뒤집기</button>
</header>
<div class="banner hidden" id="banner"></div>
<main>
  <!-- 처음 -->
  <section class="view center on" id="vStart">
    <svg class="art" viewBox="0 0 170 200" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="40" y="8" width="90" height="176" rx="16" stroke="#fff" stroke-width="3"/>
      <rect x="50" y="26" width="70" height="132" rx="6" fill="#eef1f6"/>
      <path d="M50 30h70" stroke="#e2323f" stroke-width="3"/>
      <path d="M68 158a17 17 0 0 1 34 0" stroke="var(--c)" stroke-width="3"/>
      <circle cx="85" cy="104" r="15" fill="var(--c)"/>
      <circle cx="85" cy="104" r="6" fill="#0b0f17" opacity=".35"/>
      <circle cx="98" cy="62" r="7" fill="#16181e"/>
      <path d="M104 128c14 4 22 16 24 32" stroke="#e2ae86" stroke-width="12"/>
      <path d="M85 104l13-42" stroke="var(--c)" stroke-width="2" stroke-dasharray="3 5"/>
    </svg>
    <h1>폰이 말렛이 됩니다</h1>
    <p>화면을 엄지로 누르고 끌면
큰 화면의 내 말렛이 그대로 따라와요.</p>
    <button class="primary" id="btnStart" style="margin-top:10px">시작하기</button>
  </section>

  <!-- 메시지 -->
  <section class="view center" id="vMsg"><h1 id="msgT"></h1><p id="msgB"></p></section>

  <!-- 대기실·결과 -->
  <section class="view center" id="vWait">
    <div class="big" id="waitT">대기실</div>
    <div class="side hidden" id="waitSide"><i></i><span id="waitSideT"></span></div>
    <p id="waitB"></p>
    <div class="chips" id="myStats"></div>
    <button class="primary" id="btnGo" style="margin-top:14px">게임 시작</button>
  </section>

  <!-- 경기: 내 쪽 반 코트 패드 -->
  <section class="view" id="vPlay">
    <div class="score">
      <div class="s mine"><span id="scMeN">우리</span><b id="scMe">0</b></div>
      <div class="mid"><em>:</em><span id="scGoal">7점 선승</span></div>
      <div class="s opp"><span id="scOpN">상대</span><b id="scOp">0</b></div>
    </div>
    <div class="padbox" id="pad">
      <canvas id="padCv"></canvas>
      <div class="status" id="status"></div>
      <div class="over" id="over"><b id="overT">골!</b></div>
    </div>
    <div class="tip" id="tip">엄지로 끌어서 말렛을 움직여요</div>
    <div class="tools hidden" id="tools">
      <button id="btnAuto">자동 움직이기(시험)</button>
    </div>
  </section>
</main>
<div class="debug" id="debug"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="controller.js"></script>
</body>
</html>
