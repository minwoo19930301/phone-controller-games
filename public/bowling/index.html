<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090f">
<link rel="icon" href="data:,">
<script src="/common/i18n-wait.js"></script>
<title>볼링</title>
<link rel="stylesheet" href="/vendor/pretendard/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/vendor/anton/index.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three-addons/" } }
</script>
<script type="module" src="/common/i18n-common.js"></script>
</head>
<body>
<canvas id="cv"></canvas>
<div class="vig"></div>
<div id="flash" class="flash"></div>

<!-- 경기 중 HUD -->
<div id="hud" class="hud hidden">
  <div class="turn" id="turn">
    <i class="tag" id="turnTag">1P</i>
    <div class="turn-body">
      <b id="turnName">1P</b>
      <span id="turnSub">프레임 1 / 5 · 1번째 공</span>
    </div>
    <div class="pinmap" id="pinmap"></div>
    <i class="diff" id="diffTag" data-d="normal">보통</i>
  </div>
  <div class="readout" id="readout">
    <div class="ro-speed"><b id="roSpeed">0</b><span>km/h</span></div>
    <div class="ro-hook"><span id="roHookK">훅</span><b id="roHook">—</b></div>
  </div>
  <div class="join" id="join"><img id="qrMini" alt=""><div><span class="join-k">참가</span><b id="codeMini">----</b></div></div>
  <div class="sheets" id="sheets"></div>
</div>
<div id="banner" class="banner"><b></b><span></span></div>
<div id="count" class="count"></div>
<div class="msg" id="msg"></div>

<section id="lobby" class="screen">
  <div class="lobby">
    <div class="lobby-copy">
      <div class="eyebrow">1~4인 · 차례로 한 프레임씩</div>
      <h1 class="wordmark">BOWL<br>NIGHT</h1>
      <p class="lede">폰을 휙 휘둘러 굴려요</p>
      <div class="slots" id="slots"></div>
      <div class="setbox" id="setBox"></div>
      <div class="tutbox" id="tutBox"></div>
      <div class="hint"><kbd>D</kbd><span>난이도</span><span class="dot"></span><kbd>F</kbd><span>5 / 10프레임</span></div>
    </div>
    <div class="lang-box" id="langBox"></div>
    <div class="sound-chip hidden" id="soundChip">화면을 한 번 눌러 소리 켜기</div>
    <div class="range"></div>
    <div class="qr-card">
      <img id="qr" alt="참가 QR">
      <div class="qr-code"><span>방 코드</span><b id="code">----</b></div>
      <div class="qr-url" id="url"></div>
      <div class="qr-warn hidden" id="warn">이 주소는 http라서 폰 동작 센서가 꺼져 있어요. https 주소에서 열어 주세요.</div>
    </div>
  </div>
</section>

<section id="over" class="screen over-screen hidden">
  <div class="over">
    <div class="eyebrow"><span id="overEyebrow">FINAL SCORE</span><i class="diff" id="diffOver" data-d="normal">보통</i></div>
    <h1 class="wordmark sm" id="overTitle">경기 결과</h1>
    <div class="podium" id="podium"></div>
    <div class="over-foot">
      <div class="setbox" id="setBoxOver"></div>
      <div class="hint"><kbd>D</kbd><span>난이도</span></div>
    </div>
    <div class="tutbox" id="tutBoxOver"></div>
  </div>
</section>

<section id="replaced" class="screen hidden">
  <div class="over"><h1 class="wordmark sm">다른 화면에서 열었어요</h1><p class="lede">이 방은 마지막으로 연 화면에서 이어져요.</p></div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="/common/ready.js"></script>
<script type="module" src="/bowling/i18n.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
