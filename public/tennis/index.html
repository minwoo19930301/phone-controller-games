<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1a2e">
<script src="/common/i18n-wait.js"></script>
<title>테니스</title>
<link rel="stylesheet" href="/vendor/pretendard/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/vendor/anton/index.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three-addons/" } }
</script>
<script>
  // 예전 시험 주소 ?noslow 는 ?slow=off 와 같습니다(설정 모듈은 slow 만 읽음). 모듈보다 먼저 주소만 바꿉니다.
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.has('noslow') && !q.has('slow')) { q.delete('noslow'); q.set('slow', 'off'); history.replaceState(null, '', location.pathname + '?' + q.toString() + location.hash); }
  })();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<!-- 슬로우 연출 -->
<div id="fx" class="fx"></div>
<div id="slowTag" class="slowtag"><i></i>SLOW</div>

<!-- 타이밍 링 -->
<svg id="ring" class="ring" aria-hidden="true">
  <circle id="ringHalo" class="ring-halo" r="1"></circle>
  <circle id="ringO" class="ring-o" r="1"></circle>
  <circle id="ringI" class="ring-i" r="1"></circle>
</svg>
<div id="ringTag" class="ring-tag"></div>

<!-- 중계 점수판 -->
<div id="hud" class="hud hidden">
  <div class="bug" id="bug">
    <div class="bug-head"><span class="bug-title">PCG OPEN</span><span class="bug-rule">2게임 선승</span><span class="bug-diff" id="bugDiff"></span><span class="bug-status" id="bugStatus"></span></div>
    <div class="bug-row" id="row0"><i class="srv"></i><span class="names"></span><b class="g">0</b><b class="p">0</b></div>
    <div class="bug-row" id="row1"><i class="srv"></i><span class="names"></span><b class="g">0</b><b class="p">0</b></div>
  </div>
</div>

<div id="speed" class="speed"><span id="speedL"></span><div><b id="speedV">0</b><small>km/h</small></div></div>

<div id="join" class="join hidden">
  <img id="qrMini" alt="">
  <div><span class="join-k">참가</span><b id="codeMini">----</b></div>
</div>

<div id="prompt" class="prompt"><b id="promptT"></b><span id="promptB"></span></div>
<div id="note" class="note"></div>
<div id="pop" class="pop"><b></b><span></span></div>
<div id="call" class="call"><div class="call-main" id="callMain"></div><div class="call-sub" id="callSub"></div></div>
<div id="fade" class="fade"></div>

<section id="lobby" class="screen">
  <div class="lang-box" id="langBox"></div>
  <div class="lobby">
    <div class="lobby-copy">
      <div class="eyebrow">PHONE CONTROLLER GAMES · 1~4인 · 단식·복식</div>
      <h1 class="wordmark">TENNIS</h1>
      <p class="lede">폰을 라켓처럼 휘두르세요.</p>
      <div class="slots" id="slots"></div>
      <div class="pairs" id="pairs"></div>
      <div class="setbox" id="setBox"></div>
      <div class="go-hint" id="goHint"></div>
      <div class="tutboard" id="tutBoard"></div>
    </div>
    <div class="qr-card">
      <img id="qr" alt="참가 QR">
      <div class="qr-code"><span>방 코드</span><b id="code">----</b></div>
      <div class="qr-url" id="url"></div>
      <div class="qr-warn hidden" id="warn">이 주소는 http라서 폰 동작 센서가 꺼져 있어요. https 주소에서 열어 주세요.</div>
    </div>
  </div>
  <div class="msg" id="msg"></div>
</section>

<section id="over" class="screen hidden">
  <div class="over">
    <div class="eyebrow">GAME · SET · MATCH</div>
    <h1 class="wordmark sm">테니스 결과</h1>
    <div class="podium" id="podium"></div>
    <div class="setbox over-set" id="setBoxOver"></div>
    <div class="hint" id="overHint"></div>
    <div class="tutboard over-tut" id="tutBoardOver"></div>
  </div>
</section>

<section id="replaced" class="screen hidden">
  <div class="over"><h1 class="wordmark sm">다른 화면에서 열었어요</h1><p class="lede">이 방은 마지막으로 연 화면에서 이어져요.</p></div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="/common/ready.js"></script>
<script type="module" src="/tennis/i18n.js"></script>
<script type="module" src="/common/i18n-common.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
