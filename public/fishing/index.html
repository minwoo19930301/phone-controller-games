<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16323a">
<title>배스 낚시</title>
<link rel="stylesheet" href="/vendor/pretendard/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/vendor/anton/index.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three-addons/" } }
</script>
</head>
<body>
<canvas id="cv"></canvas>
<div class="vignette"></div>

<!-- 왼쪽 위: 조과 순위 -->
<aside id="board" class="board hidden">
  <div class="bh"><span>오늘의 조과</span><span class="cols"><i></i><i>합계</i><i>최대어</i></span></div>
  <div id="rows"></div>
  <div class="rec hidden" id="rec"></div>
</aside>

<!-- 오른쪽 위: 늘 떠 있는 참가 QR -->
<aside class="qr" id="qr">
  <img id="qrImg" alt="참가 QR">
  <div class="qr-code"><b id="code">----</b></div>
  <div class="qr-k" id="qrSub">폰으로 찍으면 바로 참가</div>
  <div class="qr-full hidden" id="full">자리가 다 찼어요</div>
  <div class="seats" id="seats"></div>
  <div class="qr-warn hidden" id="warn">http 주소라 iPhone 동작 센서가 꺼져요. https 주소로 열어 주세요.</div>
</aside>

<!-- 사람마다: 낚싯대 아래 상태 칩, 릴 옆 이름표 -->
<div id="chips" class="chips"></div>
<div id="labels" class="labels"></div>

<!-- 가운데 위: 조과 카드 -->
<div id="catch" class="catch">
  <div class="catch-fish" id="catchFish"></div>
  <div class="catch-info">
    <div class="catch-top"><span class="catch-who" id="catchWho">1P</span><span class="catch-badge hidden" id="catchBadge">오늘의 최대어</span></div>
    <div class="catch-name" id="catchName">큰입배스</div>
    <div class="catch-en" id="catchEn">LARGEMOUTH BASS</div>
    <div class="catch-row"><b id="catchKg">0.0<small>kg</small></b><span id="catchLen">0cm</span></div>
  </div>
</div>

<!-- 아무도 없을 때 -->
<div id="hint" class="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.6"/><path d="M10 18.5h4"/><path d="M9 8h2v2H9zM13 8h2v2h-2zM9 12h2v2H9z"/></svg>폰 카메라로 오른쪽 위 QR을 찍으면 바로 낚시할 수 있어요</div>
<div id="sound" class="sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9.5a4 4 0 0 1 0 5"/><path d="M18.5 7a7.5 7.5 0 0 1 0 10"/></svg>화면을 한 번 누르면 소리가 켜져요</div>

<section id="replaced" class="screen hidden">
  <div class="over"><h1>다른 화면에서 열었어요</h1><p>이 방은 마지막으로 연 화면에서 이어져요.</p></div>
</section>

<pre id="debug" class="debug hidden"></pre>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
