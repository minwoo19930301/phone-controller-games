<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070d">
<script src="/common/i18n-wait.js"></script>
<title>광선검</title>
<link rel="stylesheet" href="/vendor/pretendard/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/vendor/anton/index.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three-addons/" } }
</script>
<script type="module" src="/common/i18n-common.js"></script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="views" class="views"></div>
<div id="count" class="count"></div>

<div id="join" class="join hidden">
  <img id="qrMini" alt="">
  <div><span class="join-k">참가</span><b id="codeMini">----</b></div>
</div>

<section id="lobby" class="screen">
  <div class="lang-box" id="langBox"></div>
  <div class="lobby">
    <div class="lobby-copy">
      <div class="eyebrow">PHONE CONTROLLER GAMES · 1~4인 · 화면 분할</div>
      <h1 class="wordmark">BEAM<br>BLADE</h1>
      <p class="lede" id="lede">폰을 칼자루처럼 쥐고, 예고된 쪽으로 기울여 막고 비틀거리면 휘두르세요.</p>
      <div class="setbox" id="setBox"></div>
      <div class="slots" id="slots"></div>
      <div class="tutbox" id="tutBoard"></div>
      <div class="hint"><span>폰에서 모두 준비를 누르면 시작</span></div>
    </div>
    <div class="qr-card">
      <img id="qr" alt="참가 QR">
      <div class="qr-code"><span>방 코드</span><b id="code">----</b></div>
      <div class="qr-url" id="url"></div>
      <div class="qr-warn hidden" id="warn">이 주소는 http라서 폰 동작 센서가 꺼져 있어요. https 주소에서 열어 주세요.</div>
    </div>
  </div>
  <div class="msg" id="msg"></div>
</section>

<section id="over" class="screen over-screen hidden">
  <div class="over">
    <div class="eyebrow" id="overMeta">DUEL COMPLETE</div>
    <h1 class="wordmark sm" id="overTitle">검투 결과</h1>
    <div class="podium" id="podium"></div>
    <div class="setbox over-set" id="setBoxOver"></div>
    <div class="hint"><span>폰에서 모두 다시 하기를 누르면 한 판 더</span></div>
  </div>
</section>

<section id="replaced" class="screen hidden">
  <div class="over"><h1 class="wordmark sm">다른 화면에서 열었어요</h1><p class="lede">이 방은 마지막으로 연 화면에서 이어져요.</p></div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="/common/ready.js"></script>
<script type="module" src="/saber/i18n.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
