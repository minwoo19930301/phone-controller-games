<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1220">
<title>홈런 더비</title>
<link rel="stylesheet" href="/vendor/pretendard/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/vendor/anton/index.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three-addons/" } }
</script>
</head>
<body>
<canvas id="cv"></canvas>
<div class="vignette"></div>

<!-- 경기 중 -->
<div id="hud" class="hud hidden">
  <div class="bug">
    <div class="bug-who"><span id="bName">1P</span></div>
    <div class="bug-main">
      <div class="bug-top">
        <span class="bug-label">HR</span><b id="bHr">0</b>
        <span class="bug-sep"></span>
        <span class="bug-label">최장</span><b id="bLong" class="sm">-</b>
      </div>
      <div class="pips" id="pips"></div>
    </div>
    <div class="bug-pitch" id="bPitch"></div>
    <div class="bug-diff" id="bDiff" title="난이도"></div>
  </div>
  <div class="leader" id="leader"></div>
</div>

<!-- 투타 대결 점수판 -->
<div id="duelHud" class="duel hidden">
  <div class="sb">
    <table class="ls">
      <thead><tr id="dHead"></tr></thead>
      <tbody id="dRows"></tbody>
    </table>
    <div class="sb-side">
      <div class="diamond" aria-label="주자"><i id="dB2"></i><i id="dB3"></i><i id="dB1"></i></div>
      <div class="bso">
        <div class="b"><span>B</span><i></i><i></i><i></i></div>
        <div class="s"><span>S</span><i></i><i></i></div>
        <div class="o"><span>O</span><i></i><i></i></div>
      </div>
    </div>
    <div class="sb-pitch" id="dPitch"></div>
  </div>
  <div class="sb-foot"><span id="dMatch"></span><span class="sb-right"><b id="dStatus"></b><em class="diff-chip" id="dDiff"></em></span></div>
</div>
<div id="tracker" class="tracker hidden" aria-label="투구 위치(포수 시점)">
  <div class="tk-zone"></div>
  <div id="tkDots"></div>
  <span class="tk-k">포수 시점</span>
</div>

<div id="join" class="join hidden">
  <img id="qrMini" alt="">
  <div><span class="join-k">참가</span><b id="codeMini">----</b></div>
</div>

<div id="call" class="call">
  <div class="call-main" id="callMain"></div>
  <div class="call-sub" id="callSub"></div>
</div>

<div id="live" class="live"></div>

<div id="stats" class="stats">
  <div class="stat"><span>비거리</span><b id="sDist">-</b></div>
  <div class="stat"><span>타구 속도</span><b id="sEv">-</b></div>
  <div class="stat"><span>발사각</span><b id="sLa">-</b></div>
</div>

<div id="timing" class="timing">
  <div class="timing-bar">
    <span class="tz early">빠름</span><span class="tz good" id="tGood"></span><span class="tz late">늦음</span>
    <i id="tMark"></i>
  </div>
  <div class="timing-label" id="tLabel"></div>
</div>

<!-- 대기실 -->
<section id="lobby" class="screen">
  <div class="lobby">
    <div class="lobby-copy">
      <div class="eyebrow">PHONE CONTROLLER GAMES</div>
      <h1 class="wordmark only-derby">HOME RUN<br>DERBY</h1>
      <h1 class="wordmark only-duel">PITCHER<br>VS BATTER</h1>
      <div class="modes" id="modes">
        <button class="mode" data-mode="derby"><kbd>1</kbd><b>홈런 더비</b><span>1~4명</span></button>
        <button class="mode" data-mode="duel"><kbd>2</kbd><b>투타 대결</b><span>2~4명</span></button>
      </div>
      <p class="lede only-derby">폰을 방망이처럼 휘두르세요.</p>
      <p class="lede only-duel">한 명은 던지고, 한 명은 치세요.</p>
      <div class="slots" id="slots"></div>
      <div class="set-box" id="setBox"></div>
      <div class="hint"><kbd>Enter</kbd> 시작</div>
      <div class="sound-chip" id="soundChip">화면을 한 번 눌러 소리 켜기</div>
    </div>
    <div class="qr-card">
      <img id="qr" alt="참가 QR">
      <div class="qr-code"><span>방 코드</span><b id="code">----</b></div>
      <div class="qr-url" id="url"></div>
      <div class="qr-warn hidden" id="warn">https 주소에서 열어 주세요</div>
    </div>
  </div>
</section>

<!-- 경기 끝 -->
<section id="over" class="screen hidden">
  <div class="over">
    <div class="eyebrow">FINAL</div>
    <h1 class="wordmark sm">경기 끝</h1>
    <div class="podium" id="podium"></div>
    <div class="over-set" id="overSet"></div>
    <div class="over-tut" id="overTut"></div>
    <div class="hint"><span>폰에서 모두 <b>다시 하기</b>를 누르면 시작</span></div>
  </div>
</section>

<section id="replaced" class="screen hidden">
  <div class="over"><h1 class="wordmark sm">다른 화면에서 열었어요</h1><p class="lede"></p></div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="/common/ready.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
