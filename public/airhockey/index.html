<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06050d">
<title>에어하키</title>
<script src="/common/i18n-wait.js"></script>
<link rel="stylesheet" href="/vendor/pretendard/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/vendor/anton/index.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three-addons/" } }
</script>
</head>
<body>
<canvas id="cv"></canvas>
<div class="vignette"></div>
<div id="tags" class="tags"></div>

<!-- 경기 중 -->
<div id="hud" class="hud hidden">
  <div class="sb">
    <div class="team a" id="tA"><span class="bar"></span><span class="names" id="nA">1P</span><b id="sA">0</b></div>
    <div class="mid"><span class="mode" id="sbMode">1 : 1</span><span class="first" id="sbMid">7점 선승</span><span class="lv" id="sbLv"><i></i>보통</span></div>
    <div class="team b" id="tB"><b id="sB">0</b><span class="names" id="nB">2P</span><span class="bar"></span></div>
  </div>
  <div class="speed" id="speed">
    <div class="spd-top"><span>퍽 속도</span><em id="spdTag"></em></div>
    <div class="spd-num"><b id="spdV">0</b><small>km/h</small></div>
    <div class="spd-track"><i id="spdBar"></i></div>
  </div>
  <div class="keys hidden" id="keysHelp"><kbd>W A S D</kbd> <span>아래쪽</span> · <kbd>방향키</kbd> <span>위쪽</span> · <span>판을 마우스로 끌기</span> <span>(시험용)</span></div>
</div>

<div id="join" class="join hidden">
  <img id="qrMini" alt="">
  <div><span class="join-k">참가</span><b id="codeMini">----</b></div>
</div>

<div id="call" class="call"><div class="call-main" id="callMain"></div><div class="call-sub" id="callSub"></div></div>
<div id="rule" class="rule"></div>
<div id="note" class="note"></div>

<!-- 대기실 -->
<section id="lobby" class="screen">
  <div class="lang-box" id="langBox"></div>
  <div class="lobby">
    <div class="lobby-copy">
      <div class="eyebrow">PHONE CONTROLLER GAMES · 1~4P</div>
      <h1 class="wordmark">AIR<br>HOCKEY</h1>
      <p class="lede">엄지로 끌어서 퍽을 쳐요.</p>
      <div class="slots" id="slots"></div>
      <div class="pairs" id="pairs"></div>
      <div class="set-box" id="setBox"></div>
      <div class="tut-box" id="tutBox"></div>
      <div class="hint"><span>폰에서 모두 준비를 누르면 시작해요</span><span class="kb-test hidden" id="kbTest"><span class="dot"></span> <kbd>Enter</kbd> 봇 시험 시작</span></div>
    </div>
    <div class="qr-card">
      <img id="qr" alt="참가 QR">
      <div class="qr-code"><span>방 코드</span><b id="code">----</b></div>
      <div class="qr-url" id="url"></div>
      <div class="qr-warn hidden" id="warn">http 주소라 폰 화면이 꺼질 수 있어요</div>
    </div>
  </div>
  <div class="msg" id="msg"></div>
</section>

<!-- 경기 끝 -->
<section id="over" class="screen hidden">
  <div class="over">
    <div class="eyebrow">FINAL</div>
    <h1 class="over-title" id="overTitle">승리</h1>
    <div class="over-score" id="overScore"></div>
    <div class="podium" id="podium"></div>
    <div class="over-set" id="overSet"></div>
    <div class="hint"><span>폰에서 모두 다시 하기를 누르면 다음 판</span></div>
  </div>
</section>

<section id="replaced" class="screen hidden">
  <div class="over"><h1 class="wordmark sm">다른 화면에서 열었어요</h1></div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="/common/ready.js"></script>
<!-- 사전 모듈을 먼저 둡니다: 이 모듈이 공통 사전을 함께 불러, 첫 번역 전에 두 사전이 모두 등록됩니다 -->
<script type="module" src="/airhockey/i18n.js"></script>
<script type="module" src="/common/i18n-common.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
